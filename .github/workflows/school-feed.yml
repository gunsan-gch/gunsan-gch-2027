name: 학교 일정·급식

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: school-feed
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tour/tools/fetch_school_feed.mjs
      - name: 바뀐 피드만 게시
        id: commit
        run: |
          git add -- tour/data/school-feed.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '학교 일정·급식 자동 갱신'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

  # 봇 푸시 후 main의 정적 파일을 반영합니다. 게시 실패 시 이 작업만 재시도할 수 있습니다.
  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Pages 게시 요청
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
